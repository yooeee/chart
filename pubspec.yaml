name: pulse_chart
description: A responsive cross-platform stock chart workspace built with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  google_sign_in_web: 1.1.0
  http: ^1.5.0
  shared_preferences: ^2.5.3
  web: ^1.1.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/pulse_chart_icon.png
